apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.backend.image.repository }}
  labels:
    app: {{ .Values.backend.image.repository }}
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Values.backend.image.repository }}
  template:
    metadata:
      labels:
        app: {{ .Values.backend.image.repository }}
    spec:
      containers:
        - name: {{ .Values.backend.image.repository }}
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.backend.service.targetPort }}
          livenessProbe:
            httpGet:
              path: /
              port: {{ .Values.backend.service.targetPort }}
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: {{ .Values.backend.service.targetPort }}
            initialDelaySeconds: 5
            periodSeconds: 10
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: todo-secrets
                  key: DATABASE_URL
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: todo-secrets
                  key: OPENAI_API_KEY
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
